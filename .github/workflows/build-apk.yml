
name: Construire APK Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Extraire le projet ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Archive ZIP introuvable"
            exit 1
          fi
          mkdir -p /tmp/projet
          unzip -o "$ZIP_FILE" -d /tmp/projet
          cp -R /tmp/projet/. .

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Construire le jeu APK
        run: gradle assembleDebug

      - name: Publier le fichier APK
        uses: actions/upload-artifact@v4
        with:
          name: Les-Petits-Calculs-APK
          path: app/build/outputs/apk/debug/app-debug.apk
