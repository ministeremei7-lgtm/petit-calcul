
name: Construire APK Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Extraire le projet ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          test -n "$ZIP_FILE"
          mkdir -p /tmp/projet
          unzip -o "$ZIP_FILE" -d /tmp/projet
          find /tmp/projet -mindepth 1 -maxdepth 1 ! -name .github -exec cp -R {} . \;

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Construire APK
        run: gradle assembleDebug

      - name: Recuperer APK
        uses: actions/upload-artifact@v4
        with:
          name: Les-Petits-Calculs-APK
          path: app/build/outputs/apk/debug/app-debug.apk
